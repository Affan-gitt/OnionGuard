name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master, stable-restore ]

jobs:
  build-ios:
    name: Build iOS Application (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (.app)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 OnionGuard.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionGuard-iOS-IPA
          path: build/ios/iphoneos/OnionGuard.ipa
          retention-days: 14
